# Model registry + camera inference profiles.
# Nothing is downloaded automatically. Mount weights into the worker container (see README).
models:
  best:
    kind: detection
    backend: yolov5          # best.pt is a legacy YOLOv5 checkpoint; use "ultralytics" for YOLOv8+ weights
    weights: /models/best.pt
    version: "custom-1.0"
    options: {conf: 0.45, iou: 0.7, imgsz: 640, half: true, classes: [0, 1, 2, 3, 4],
              class_names: [Car, Motorcycle, Truck, Bus, Bicycle]}  # Car Motorcycle Truck Bus Bicycle (best.pt class ids)
  person:                  # official YOLOv8n (COCO), person class only
    kind: detection
    backend: ultralytics
    weights: /models/yolov8n.pt
    version: "yolov8n"
    options: {conf: 0.4, iou: 0.7, imgsz: 640, half: true, classes: [0], class_names: [person]}
  pose:                    # official YOLOv8n-pose: person boxes + 17 keypoints (skeleton drawn on the stream)
    kind: detection
    backend: ultralytics_pose
    weights: /models/yolov8n-pose.pt
    version: "yolov8n-pose"
    options: {conf: 0.4, iou: 0.7, imgsz: 640, half: true, class_names: [person]}
  # --- development models (explicit mock backend; NOT real inference)
  mock_blob:
    kind: detection
    backend: mock
    version: "mock-1"
    options: {class_name: blob, threshold: 200}
  mock_ocr: {kind: ocr, backend: mock, version: mock-1}
  mock_reid: {kind: reid, backend: mock, version: mock-1}
  mock_dino: {kind: dino, backend: mock, version: mock-1}
  mock_sam: {kind: segmentation, backend: mock, version: mock-1}
  # --- real adapters to implement/register (see README "Adding a model adapter")
  # ocr_plate: {kind: ocr, backend: easyocr, weights: /models/ocr}
  # reid_osnet: {kind: reid, backend: torchreid, weights: /models/osnet.pt}
  # dino_v2: {kind: dino, backend: hf_dino, weights: /models/dinov2}
  # sam3: {kind: segmentation, backend: sam3, weights: /models/sam3.pt}

profiles:
  default:                 # same as `vehicle`; kept so existing cameras keep working
    detection: best
    stages: [detect]
    fps: 5
  vehicle:                 # car / motorcycle / truck / bus / bicycle
    detection: best
    stages: [detect]
    fps: 5
  person:                  # person detection
    detection: person
    stages: [detect]
    fps: 5
  pose:                    # person pose (skeleton)
    detection: pose
    stages: [detect]
    fps: 5
  # profile used by synthetic/mock development stack (VMS_FORCE_MOCK_MODELS=true maps ALL models to mock)
  mock_full:
    detection: mock_blob
    stages: [detect, ocr, reid, dino, sam]
    ocr: mock_ocr
    reid: mock_reid
    dino: mock_dino
    sam: mock_sam
    ocr_classes: ["*"]
    reid_classes: [blob]
    sam_classes: [blob]
    fps: 5
