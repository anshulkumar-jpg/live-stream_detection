global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs: [{targets: ["api:8000"]}]

  # Every worker container exposes its own process-local /metrics on :9101.
  # DNS service discovery finds all replicas of the `gpu-worker` service name / network alias.
  - job_name: gpu-workers
    dns_sd_configs:
      - names: ["gpu-worker"]
        type: A
        port: 9101
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: worker_service

  - job_name: mediamtx
    metrics_path: /metrics
    basic_auth:
      username: ${MTX_API_USER}   # rendered by compose entrypoint (see docker-compose.yml)
      password: ${MTX_API_PASS}
    static_configs: [{targets: ["mediamtx:9998"]}]

  - job_name: kafka-exporter
    static_configs: [{targets: ["kafka-exporter:9308"]}]

  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
