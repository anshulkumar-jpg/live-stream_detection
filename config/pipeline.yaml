# Worker pipeline configuration (see backend/app/core/config.py for all fields/defaults)
worker:
  max_streams: 16          # initial target, NOT a guaranteed capacity: benchmark on your hardware
  heartbeat_interval_s: 3
  metrics_interval_s: 10
decode:
  width: 1280
  height: 720
  aspect: letterbox        # stretch | letterbox | crop
  hwaccel: auto            # auto | cuda | none   (auto => NVDEC only if FFmpeg build lists cuda)
  allow_cpu_fallback: true
  rtsp_transport: tcp      # tcp | udp
  read_timeout_s: 10
  reconnect_initial_s: 1
  reconnect_max_s: 30
router:
  queue_size: 4
  default_fps: 5
  stale_ms: 2000
inference:
  batch_size: 8
  batch_timeout_ms: 25
  gpu_mem_limit_fraction: 0.9
overlay:
  enabled: true
  draw_labels: true
  draw_timestamp: true
  draw_confidence: true
  detection_hold_ms: 1500
  class_colors:            # BGR, matched case-insensitively (best.pt classes)
    car: [230, 60, 160]         # purple
    motorcycle: [0, 140, 255]   # orange
    truck: [60, 60, 235]        # red
    bus: [90, 190, 40]          # green
    bicycle: [230, 200, 0]      # cyan
encoder:
  codec: h264              # h264 | h265
  encoder: auto            # auto | nvenc | software
  allow_software_fallback: true
  width: 1280
  height: 720
  fps: 15
  bitrate_kbps: 2500
  renditions: [480, 360, 240, 144]   # extra quality levels (HLS ladder); 720 is the main stream. [] disables
  gop: 30
  preset: veryfast
  nvenc_preset: p3
